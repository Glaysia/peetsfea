[project]
name = "peetsfea"
version = "0.2.25.1"
description = "Spec-first deterministic device design with Pyaedt."
readme = "README.md"
requires-python = "==3.12.12"
license = { text = "MIT" }
dependencies = [
]

[project.optional-dependencies]
all = [
  "build123d>=0.10.0",
  "cadquery>=2.6.1",
  "dearpygui>=2.1.1",
  "ipykernel>=7.2.0",
  "ocp-tessellate==3.1.2",
  "ocp-vscode>=3.1.2",
  "pandas>=2.3.3",
  "pyaedt[graphics]==0.25.1",
  "pyvista>=0.46.5",
  "sympy>=1.14.0",
  "pytest",
  "pytest-cov",
  "ruff",
  "mypy",
  "pyright",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/peetsfea"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true
disallow_incomplete_defs = false
disallow_untyped_defs = false

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["src", "tests", "entry"]
exclude = ["ref", "**/__pycache__"]
typeCheckingMode = "basic"
reportMissingImports = "none"
reportMissingModuleSource = "none"

[tool.pytest.ini_options]
markers = [
  "contract: pure-Python acceptance/contract tests for default CI",
  "pyaedt_integration: optional integration tests that require AEDT/Pyaedt runtime",
  "legacy_type1: frozen legacy type1 tests excluded from default collection",
]
norecursedirs = ["tests/legacy"]
