# Unified type2 sampled authoring input.
# ----------------------------------------------------------------------------
# 이 파일은 type2 sweep의 SSOT다.
# fixed TOML은 이 파일을 임의 seed로 하나 realization/freeze한 결과여야 한다.
# 별도 TX sweep TOML을 만들지 않는다.
#
# 현재 상태:
# - RX single-coil은 parser/sampler/export/build 경로가 살아 있다.
# - TX columns는 STEP/export/build/setup-ready milestone이다.
# - 이 파일은 sample_type2(..., make_step_on_sample=true|false) 양쪽에서 유효하다.
# - build/setup-ready는 TX columns + RX single-coil pair를 AEDT solve-ready 상태로 만든다.
# - TX 변수는 여기서만 관리하고, geometry milestone이 오면 이 same surface를 사용해 구현한다.
#
# Range 형식:
# - [true, start, end, count]는 integer 후보 range다.
# - [false, start, end, count]는 float 후보 range다.
# - fixed TOML에서는 같은 public field를 [*, value, value, 1]로 freeze한다.

spec_version = "0.2.22"
schema_id = "peetsfea.type2.step.v8"
runtime_compatible = false

[design]
units = "mm"

[backend]
authoring_tool = "build123d"
solver_tool = "hfss"
interchange_format = "step"

[simulation]
# HFSS radiation boundary margin. RX-only build/setup-ready 경로와 TX columns + RX setup-ready 경로가 같은 top-level key를 공유한다.
radiation_margin_mm = 3500.0

[outputs]
# Active TX+RX setup uses the full 0.2.21-style output-variable contract.
report_name = "Output Variables Table1"
solution_name = "Setup1 : LastAdaptive"
primary_sweep = "Freq"
report_category = "Terminal Solution Data"
plot_type = "Data Table"

[[outputs.variables]]
name = "Ltx_uH"
expression = "im(Zt(TX_TML,TX_TML))/2/pi/freq*1e6"

[[outputs.variables]]
name = "Lrx_uH"
expression = "im(Zt(RX_TML,RX_TML))/2/pi/freq*1e6"

[[outputs.variables]]
name = "M_uH"
expression = "abs(im(Zt(TX_TML,RX_TML))/2/pi/freq*1e6)"

[[outputs.variables]]
name = "k_ratio"
expression = "M_uH/sqrt(Ltx_uH*Lrx_uH)"

[[outputs.variables]]
name = "Qtx_ratio"
expression = "im(Zt(TX_TML,TX_TML))/re(Zt(TX_TML,TX_TML))"

[[outputs.variables]]
name = "Qrx_ratio"
expression = "im(Zt(RX_TML,RX_TML))/re(Zt(RX_TML,RX_TML))"

[[outputs.variables]]
name = "FOM_ratio"
expression = "k_ratio*sqrt(Qtx_ratio*Qrx_ratio)"

[[outputs.variables]]
name = "Rtx_ac_ohm"
expression = "re(Zt(TX_TML,TX_TML))"

[[outputs.variables]]
name = "Rrx_ac_ohm"
expression = "re(Zt(RX_TML,RX_TML))"

[[outputs.variables]]
name = "Xtx_ohm"
expression = "im(Zt(TX_TML,TX_TML))"

[[outputs.variables]]
name = "Xrx_ohm"
expression = "im(Zt(RX_TML,RX_TML))"

[[outputs.variables]]
name = "M_over_Ltx_ratio"
expression = "M_uH/Ltx_uH"

[[outputs.variables]]
name = "M_over_Lrx_ratio"
expression = "M_uH/Lrx_uH"

[[outputs.variables]]
name = "Gtx_S"
expression = "re(Yt(TX_TML,TX_TML))"

[[outputs.variables]]
name = "Btx_S"
expression = "im(Yt(TX_TML,TX_TML))"

[[outputs.variables]]
name = "Grx_S"
expression = "re(Yt(RX_TML,RX_TML))"

[[outputs.variables]]
name = "Brx_S"
expression = "im(Yt(RX_TML,RX_TML))"

[[outputs.variables]]
name = "S11_mag_ratio"
expression = "mag(S(TX_TML,TX_TML))"

[[outputs.variables]]
name = "S21_mag_ratio"
expression = "mag(S(TX_TML,RX_TML))"

[[outputs.variables]]
name = "S21_phase_deg"
expression = "ang_deg_val(S(TX_TML,RX_TML))"

[[outputs.variables]]
name = "S22_mag_ratio"
expression = "mag(S(RX_TML,RX_TML))"

[[outputs.variables]]
name = "eta_s21_power_ratio"
expression = "S21_mag_ratio*S21_mag_ratio"

[[outputs.variables]]
name = "eta_tx_accept_ratio"
expression = "1-S11_mag_ratio*S11_mag_ratio"

[[outputs.variables]]
name = "eta_rx_accept_ratio"
expression = "1-S22_mag_ratio*S22_mag_ratio"

[[outputs.variables]]
name = "eta_match_product_ratio"
expression = "eta_tx_accept_ratio*eta_rx_accept_ratio"

[[outputs.variables]]
name = "eta_s21_from_tx_accept_ratio"
expression = "eta_s21_power_ratio/eta_tx_accept_ratio"

[[outputs.variables]]
name = "eta_s21_from_rx_accept_ratio"
expression = "eta_s21_power_ratio/eta_rx_accept_ratio"

[[outputs.variables]]
name = "eta_s21_two_sided_norm_ratio"
expression = "eta_s21_power_ratio/(eta_tx_accept_ratio*eta_rx_accept_ratio)"

[[outputs.variables]]
name = "eta_fom_max_ratio"
expression = "(FOM_ratio*FOM_ratio)/((1+sqrt(1+FOM_ratio*FOM_ratio))*(1+sqrt(1+FOM_ratio*FOM_ratio)))"

[coordinate_system]
origin = [0.0, 0.0, 0.0]
x_axis = "+right_from_wall"
y_axis = "+screen_horizontal"
z_axis = "+up"

# ----------------------------------------------------------------------------
# Non-model object registry
# ----------------------------------------------------------------------------

[[non_model_objects]]
id = "floor"
kind = "floor"
primitive = "box"
present = true
non_model = true
material = "vacuum"
plane = "XY"
origin_xyz = [0.0, -2500.0, -761.0]
size_xyz = [5000.0, 5000.0, 300.0]

[[non_model_objects]]
id = "shelf"
kind = "shelf"
primitive = "box"
present = true
non_model = true
material = "vacuum"
plane = "XY"
origin_xyz = [0.0, -921.0, -461.0]
size_xyz = [400.0, 1842.0, 461.0]

[[non_model_objects]]
id = "wall"
kind = "wall"
primitive = "box"
present = true
non_model = true
material = "vacuum"
plane = "YZ"
origin_xyz = [-200.0, -2000.0, -461.0]
size_xyz = [200.0, 4000.0, 3000.0]

[[non_model_objects]]
id = "tv"
kind = "tv"
primitive = "box"
present = true
non_model = true
material = "vacuum"
plane = "YZ"
origin_xyz = [0.0, -921.0, 139.0]
size_xyz = [9.0, 1842.0, 1055.0]

[[non_model_objects]]
id = "tx_region"
kind = "tx_region"
primitive = "box"
present = true
non_model = true
material = "vacuum"
plane = "YZ"
# TX가 들어갈 수 있는 최대 guide box다.
# 실제 TX sampled footprint는 아래 tx_region_actual이 이 box 안에서 정한다.
origin_xyz = [0.0, -140.0, 0.0]
size_xyz = [160.0, 280.0, 90.0]

[[non_model_objects]]
id = "rx_region_max"
kind = "rx_region_max"
primitive = "box"
present = true
non_model = true
material = "vacuum"
plane = "YZ"
# RX single-coil placement owner다.
# TX turn-weight polynomial의 거리 기준은 이 RX region의 중심 X에서 출발한다.
origin_xyz = [0.0, -280.0, 139.0]
size_xyz = [5.0, 560.0, 360.0]

[[non_model_objects]]
id = "tx_region_actual"
kind = "tx_region_actual"
source_region_id = "tx_region"
# tx_region 안에서 실제 TX가 사용할 top-view footprint를 예약한다.
# TX geometry는 아직 만들지 않지만, sampler는 이 footprint와 grid count를 먼저 확정한다.
[non_model_objects.x_usage_ratio]
# tx_region X span 중 사용할 비율이다. 현재 sweep은 full X를 고정 사용한다.
range = [false, 1.0, 1.0, 1]
[non_model_objects.y_usage_ratio]
# tx_region Y span 중 사용할 비율이다. 현재 sweep은 full Y를 고정 사용한다.
range = [false, 1.0, 1.0, 1]
[non_model_objects.x_division_count]
# TX coil grid의 X 방향 column 수다. realized coil count = x_division_count * y_division_count.
range = [true, 1, 3, 3]
[non_model_objects.y_division_count]
# TX coil grid의 Y 방향 row 수다.
range = [true, 1, 3, 3]

[[non_model_objects]]
id = "tx_region_actual_stack_space"
kind = "tx_region_actual_stack_space"
source_region_id = "tx_region_actual"
# 각 realized tx_region_actual tile 안에 생기는 TX stack reservation volume 두께다.
# TX columns geometry가 들어갈 자리이며, 현재는 parser/sampler 및 future geometry의 owner다.
total_thickness_mm = 5.0
[non_model_objects.scale_ratio]
# 각 tile footprint를 비슷한 사각형으로 축소/확대하는 비율이다.
# 현재 sweep에서는 TX footprint scale을 고정한다.
range = [false, 0.5, 0.5, 1]
[non_model_objects.tilt_enabled]
# stack_space는 RX 중심을 향하도록 기울이는 future placement owner다.
# 현재 milestone에서는 fixed-on 상태만 허용한다.
range = [true, 1, 1, 1]

# ----------------------------------------------------------------------------
# Modeled object registry
# ----------------------------------------------------------------------------

[[modeled_objects]]
object_id = "rx_rect_void_coil"
role = "rx_single_coil"
material = "composite"
model_state = true
# RX는 현재 EM-ready active modeled object다.
# 아래 RX fields는 sampled TOML과 build design variables에 실제로 반영된다.
pcb_thickness_mm = 0.3
copper_thickness_mm = 0.1
[modeled_objects.outer_x_usage_ratio]
# RX placement owner span 대비 local X outer size ratio.
range = [false, 0.1, 0.6, 17]
[modeled_objects.outer_y_usage_ratio]
# RX placement owner span 대비 local Y outer size ratio.
range = [false, 0.1, 0.6, 17]
[modeled_objects.turn_count]
# RX spiral turn count. RX single-coil은 현재 layer_count=1만 지원한다.
range = [true, 2, 6, 5]
[modeled_objects.layer_count]
# RX multilayer는 아직 지원하지 않으므로 1로 고정한다.
range = [true, 1, 1, 1]
[modeled_objects.underlay_repeat_count]
# RX full backing underlay repeat owner. 현재 기본 sweep은 full backing으로 고정한다.
range = [true, 8, 8, 1]
[modeled_objects.layer_gap_mm]
# RX layer_count가 1이라 geometry에는 실질 영향이 없지만 public field shape를 유지한다.
range = [false, 2, 2, 1]
[modeled_objects.terminal_stub_length_mm]
# RX terminal stub length.
range = [false, 5, 5, 1]
[modeled_objects.void_usage_ratio]
# centered void keepout의 X/Y 공통 size ratio다.
range = [false, 0.2, 0.8, 10]
[modeled_objects.margin_ratio]
# void-to-outer minimum margin ratio.
range = [false, 0.05, 0.05, 1]
[modeled_objects.metal_fill_factor]
# trace/gap pitch 안에서 copper가 차지하는 비율.
range = [false, 0.2, 0.6, 15]
[modeled_objects.terminal_path]
# terminal path는 same-corner format '<outer>_<cw|ccw>_to_<inner>'를 사용한다.
value = "A_cw_to_a"

[[modeled_objects]]
object_id = "tx_rect_void_columns"
role = "tx_rect_void_columns"
material = "composite"
model_state = true
# TX columns는 현재 active TX modeled/setup-ready role이다.
# 이 block의 변수는 반드시 sweep SSOT로 유지한다.
# export_type2_step_artifacts/build/setup-ready는 이 role을 아직 geometry/runtime으로 처리하면 안 된다.
pcb_thickness_mm = 0.3
copper_thickness_mm = 0.1
[modeled_objects.layer_count]
# 각 TX coil 내부 layer 수다. 같은 coil 내부 layer들은 병렬 연결로 해석한다.
# TX geometry/setup-ready에 반영되는 각 realized coil 내부 layer 수다.
range = [true, 1, 4, 4]
[modeled_objects.layer_gap_mm]
# TX coil 내부 layer 간격이다.
range = [false, 1.0, 1.8, 5]
[modeled_objects.terminal_stub_length_mm]
# field는 유지하지만 future geometry 의미는 "모든 terminal stub bottom Z를 최저 bottom Z로 통일"이다.
range = [false, 10.0, 10.0, 1]
[modeled_objects.void_usage_ratio]
# TX rect/void coil의 centered void 공통 size ratio다.
# TX rect/void geometry에 반영된다.
range = [false, 0.2, 0.2, 1]
[modeled_objects.margin_ratio]
# TX void-to-outer minimum margin ratio.
range = [false, 0.05, 0.05, 1]
[modeled_objects.metal_fill_factor]
# TX trace fill factor. 현재 sweep은 고정한다.
range = [false, 0.6, 0.6, 1]
[modeled_objects.connection_mode]
# TX realized coil grid 전체 연결 방식.
# 0 = 모든 realized coil 병렬, 1 = 모든 realized coil 직렬.
# 이 값에 따라 effective sampled turn owner가 하나만 선택된다.
range = [true, 0, 1, 2]
[modeled_objects.equivalent_turn_count]
# connection_mode에 따라 series/parallel 양쪽에서 같은 public owner를 사용한다.
# canonical sweep range: [false, 0.1111111111111111, 31.0, 100]
range = [false, 0.1111111111111111, 31.0, 100]
[modeled_objects.turn_weight_a]
# per-coil turn 분배 weight 다항식 w_i = a + b*x_i + c*x_i^2 의 상수항.
# x_i는 RX 중심 대비 각 TX coil 중심의 normalized |x| 거리다.
range = [false, 0.5, 1.5, 5]
[modeled_objects.turn_weight_b]
# weight 다항식의 1차항 계수. 음수/양수 모두 허용해 center-heavy/edge-heavy 후보를 탐색한다.
range = [false, -0.5, 0.5, 21]
[modeled_objects.turn_weight_c]
# weight 다항식의 2차항 계수.
# realized 모든 coil에서 w_i <= 0 이 되면 future preflight/allocator는 즉시 실패해야 한다.
range = [false, -0.3, 0.3, 21]
[modeled_objects.terminal_path]
# TX terminal path. geometry milestone에서 실제 routing/terminal anchor에 반영한다.
value = "A_cw_to_a"
