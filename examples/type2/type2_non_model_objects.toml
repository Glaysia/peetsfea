# peetsfea non-model scene draft TOML
# ----------------------------------------------------------------------------
# 목적:
# - build123d 기반 geometry authoring으로 갈아타기 전, AEDT non-model scene
#   envelope만 새 TOML 형태로 먼저 고정한다.
# - 이 파일은 현재 0.2.22 runtime에서 바로 실행되는 spec이 아니다.
# - 기존 type1 코드는 참고만 하며, 새 spec은 explicit object list를 SSOT로 삼는다.
# - 단위는 mm다.

spec_version = "0.2.22"
schema_id = "peetsfea.non_model_scene.draft.v1"
runtime_compatible = false

[design]
units = "mm"

[backend]
authoring_tool = "build123d"
solver_tool = "hfss"
interchange_format = "step"

[coordinate_system]
origin = [0.0, 0.0, 0.0]
x_axis = "+right_from_wall"
y_axis = "+screen_horizontal"
z_axis = "+up"

# ----------------------------------------------------------------------------
# Non-model object contract
# ----------------------------------------------------------------------------
# 모든 object는 AEDT 기준 non-model vacuum box다.
# build123d 단계에서는 envelope/placement guide로만 사용하고, EM solve target으로
# 취급하지 않는다.

[[non_model_objects]]
id = "floor"
kind = "floor"
primitive = "box"
present = true
non_model = true
material = "vacuum"
plane = "XY"
origin_xyz = [0.0, -2500.0, -300.0]
size_xyz = [5000.0, 5000.0, 300.0]

