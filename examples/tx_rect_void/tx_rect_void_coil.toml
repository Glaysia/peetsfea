# Standalone TX rectangular/void coil STEP generator spec.
# ----------------------------------------------------------------------------
# This is not a type1/PyAEDT runtime spec. It is a build123d authoring spec for
# a single TX rectangular spiral coil exported as STEP. Units are millimeters.

spec_version = "0.2.22"
schema_id = "peetsfea.tx_rect_void_coil.step.v1"
runtime_compatible = false

[design]
units = "mm"

[backend]
authoring_tool = "build123d"
interchange_format = "step"
ansys_import = "out_of_scope"

[manufacturing]
pcb_thickness_mm = 1.6
copper_thickness_mm = 0.1

# ----------------------------------------------------------------------------
# TX coil SSOT
# ----------------------------------------------------------------------------
# range = [is_integer, start, end, count]
# The void rectangle is a route-around keepout. Copper must not enter it.

[tx_coil.outer_x_mm]
range = [false, 30.0, 158.0, 129]

[tx_coil.outer_y_over_outer_x]
range = [false, 0.50, 1.60, 111]

[tx_coil.turn_count]
range = [true, 1, 9, 9]

[tx_coil.layer_count]
range = [true, 1, 3, 3]

[tx_coil.layer_gap_mm]
# Adjacent PCB dielectric-to-dielectric air gap. The generator requires >= 2.0.
range = [false, 2.0, 8.0, 7]

[tx_coil.void_x_over_outer_x]
range = [false, 0.20, 0.50, 31]

[tx_coil.void_y_over_outer_y]
range = [false, 0.20, 0.50, 31]

[tx_coil.void_center_x_over_outer_x]
range = [false, -0.10, 0.10, 41]

[tx_coil.void_center_y_over_outer_y]
range = [false, -0.10, 0.10, 41]

[tx_coil.margin_ratio]
# Minimum edge clearance as a ratio of each corresponding outer dimension.
range = [false, 0.03, 0.10, 15]

[tx_coil.metal_fill_factor]
# Side-local trace fraction within each side pitch cell.
range = [false, 0.35, 0.75, 41]

[tx_coil.terminal_path]
# A-D are outer corners, a-d are matching void corners, viewed from +Z with +X right and +Y up.
# v1 requires matching corners, for example A_cw_to_a, B_ccw_to_b, C_cw_to_c, D_ccw_to_d.
value = "A_cw_to_a"
