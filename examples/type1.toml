# peetsfea primary TOML (`run/type1.toml` symlinks to this file)
# ----------------------------------------------------------------------------
# Phase 1 spec-remodel target structure.
# IMPORTANT:
# - Keep comments rich and explicit in this file.
# - When adding/changing fields, always add 1-2 lines describing intent/constraints.
# - Treat comments as part of the spec contract for future maintainers/agents.
# Numeric range convention:
#   range = [is_integer, start, end, count]

spec_version = "0.1.4"

[design]
units = "mm"

[backend]
tool = "hfss"

# ----------------------------------------------------------------------------
# Non-model scene/envelope sizes

[tv.width_mm]
range = [false, 1842.0, 1842.0, 1]

[tv.height_mm]
range = [false, 1055.0, 1055.0, 1]

[tv.thickness_mm]
# TV panel thickness (updated to 9mm class).
range = [false, 9.0, 9.0, 1]

[tv.base_z_mm]
# TV bottom elevation from floor (z=0 reference plane).
range = [false, 600.0, 600.0, 1]

[tx.region.outer_w_mm]
range = [false, 160.0, 160.0, 1]

[tx.region.outer_h_mm]
range = [false, 280.0, 280.0, 1]

[tx.region.thickness_mm]
range = [false, 90.0, 90.0, 1]

[tx.region.z_parts.vertical_z_mm]
# Top zone in TX max region for vertical-coil allocation.
range = [false, 15.0, 45.0, 7]

[tx.region.z_parts.dd_z_mm]
# Middle zone in TX max region for DD-coil allocation.
range = [false, 15.0, 45.0, 7]
# Bottom leftover is implicit:
# leftover_z = tx.region.thickness_mm - vertical_z_mm - dd_z_mm

[rx.region.outer_w_mm]
range = [false, 560.0, 560.0, 1]

[rx.region.outer_h_mm]
range = [false, 360.0, 360.0, 1]

[rx.region.thickness_mm]
# RX region thickness is fixed to 4mm for wall-aligned placement baseline.
range = [false, 4.0, 4.0, 1]

[wall.thickness_mm]
range = [false, 200.0, 200.0, 1]

[wall.size_y_mm]
range = [false, 4000.0, 4000.0, 1]

[wall.size_z_mm]
range = [false, 3000.0, 3000.0, 1]

[floor.thickness_mm]
range = [false, 300.0, 300.0, 1]

[floor.size_x_mm]
range = [false, 5000.0, 5000.0, 1]

[floor.size_y_mm]
range = [false, 5000.0, 5000.0, 1]

# ----------------------------------------------------------------------------
# Grouped coil geometry controls

[coil_shape.outer_x]
# Keep TX coil max below tx.region minimum span (currently 160mm).
range = [false, 120.0, 150.0, 4]

[coil_shape.outer_y]
range = [false, 110.0, 150.0, 5]

[coil_shape.turn_count_max]
range = [true, 6, 12, 7]

[coil_shape.inner_margin_x]
range = [false, 2.0, 8.0, 4]

[coil_shape.inner_margin_y]
range = [false, 2.0, 8.0, 4]

# Grouped coil spacing controls
[coil_spacing.tx_dd_pair_spacing_mm]
range = [false, 20.0, 60.0, 5]

[coil_spacing.rx_dd_pair_spacing_mm]
range = [false, 20.0, 60.0, 5]

[coil_spacing.tx_vertical_span_mm]
range = [false, 0.0, 15.0, 4]

# Trace/gap profile controls
[trace_gap_profile.trace_profile]
mode = "biased_linear"
base = 1.0
outer_bias = 0.10
inner_bias = -0.10
clamp_min = 0.20

[trace_gap_profile.gap_profile]
mode = "biased_linear"
base = 0.50
outer_bias = 0.05
inner_bias = -0.05
clamp_min = 0.15

# ----------------------------------------------------------------------------
# Coil groups

[[coil_groups]]
kind = "tx_dd"
count_mode = [true, 2, 4, 2]
instance_transforms = [
  { dx = 0.0, dy = 0.0, dz = 0.0, rot_deg = 0.0 },
]

[[coil_groups]]
kind = "tx_vertical"
count_range = [true, 0, 4, 5]
instance_transforms = [
  { dx = 0.0, dy = 0.0, dz = 0.0, rot_deg = 0.0 },
]

[[coil_groups]]
kind = "rx_dd"
count_fixed = [true, 2, 2, 1]
instance_transforms = [
  { dx = 0.0, dy = 0.0, dz = 0.0, rot_deg = 180.0 },
]

# ----------------------------------------------------------------------------
# PCB instances (8 total: 4 always-on + 4 optional)
# present follows integer range contract: 0/1

[[pcbs]]
id = "tx_main_0"
role = "tx"
position = [0.0, 0.0, 0.0]
rotation_deg = 0.0
present = [true, 1, 1, 1]
mounts = ["tx_dd:0", "tx_vertical:*"]

[[pcbs]]
id = "tx_main_1"
role = "tx"
position = [0.0, 0.0, 2.0]
rotation_deg = 0.0
present = [true, 1, 1, 1]
mounts = ["tx_dd:1", "tx_vertical:*"]

[[pcbs]]
id = "rx_main_0"
role = "rx"
position = [0.0, 0.0, 110.0]
rotation_deg = 0.0
present = [true, 1, 1, 1]
mounts = ["rx_dd:0"]

[[pcbs]]
id = "rx_main_1"
role = "rx"
position = [0.0, 0.0, 112.0]
rotation_deg = 0.0
present = [true, 1, 1, 1]
mounts = ["rx_dd:1"]

[[pcbs]]
id = "tx_opt_0"
role = "tx"
position = [40.0, 0.0, 0.0]
rotation_deg = 0.0
present = [true, 0, 1, 2]
mounts = ["tx_vertical:*"]

[[pcbs]]
id = "tx_opt_1"
role = "tx"
position = [-40.0, 0.0, 0.0]
rotation_deg = 0.0
present = [true, 0, 1, 2]
mounts = ["tx_vertical:*"]

[[pcbs]]
id = "rx_opt_0"
role = "rx"
position = [40.0, 0.0, 110.0]
rotation_deg = 0.0
present = [true, 0, 1, 2]
mounts = ["rx_dd:0"]

[[pcbs]]
id = "rx_opt_1"
role = "rx"
position = [-40.0, 0.0, 110.0]
rotation_deg = 0.0
present = [true, 0, 1, 2]
mounts = ["rx_dd:1"]
