# peetsfea primary TOML (`run/type1.toml` symlinks to this file)
# ----------------------------------------------------------------------------
# Phase 1 spec-remodel target structure.
# IMPORTANT:
# - Keep comments rich and explicit in this file.
# - When adding/changing fields, always add 1-2 lines describing intent/constraints.
# - Treat comments as part of the spec contract for future maintainers/agents.
# Numeric range convention:
#   range = [is_integer, start, end, count]

spec_version = "0.2.16"

[design]
units = "mm"

[backend]
tool = "hfss"

[simulation]
# EM policy: all values are in Hz/mm and consumed as SSOT by em_pipeline.
# setup/sweep frequencies are currently kept for compatibility, but frequency
# sweep generation is temporarily disabled in the runtime.
radiation_margin_mm = 3500.0
setup_frequency_hz = 6.78e6
sweep_start_hz = 1.0e6
sweep_stop_hz = 45.0e6
validation_gate = "hard_fail"
max_delta_s = 0.007
maximum_passes = 13
minimum_passes = 9
minimum_converged_passes = 10
percent_refinement = 20
basis_order = 1
port_accuracy = 2

# ----------------------------------------------------------------------------
# AEDT output-variable/report definition

[outputs]
# Output/report generation is TOML-driven in 0.2.16. This single table is the
# SSOT for the one AEDT data-table report created by the EM pipeline.
report_name = "Output Variables Table1"
solution_name = "Setup1 : LastAdaptive"
primary_sweep = "Freq"
report_category = "Terminal Solution Data"
plot_type = "Data Table"

[[outputs.variables]]
name = "Ltx_uH"
expression = "im(Zt(TX_TML,TX_TML))/2/pi/freq*1e6"

[[outputs.variables]]
name = "Lrx_uH"
expression = "im(Zt(RX_TML,RX_TML))/2/pi/freq*1e6"

[[outputs.variables]]
name = "M_uH"
expression = "abs(im(Zt(TX_TML,RX_TML))/2/pi/freq*1e6)"

[[outputs.variables]]
name = "k_ratio"
expression = "M_uH/sqrt(Ltx_uH*Lrx_uH)"

[[outputs.variables]]
name = "Qtx_ratio"
expression = "im(Zt(TX_TML,TX_TML))/re(Zt(TX_TML,TX_TML))"

[[outputs.variables]]
name = "Qrx_ratio"
expression = "im(Zt(RX_TML,RX_TML))/re(Zt(RX_TML,RX_TML))"

[[outputs.variables]]
name = "FOM_ratio"
expression = "k_ratio*sqrt(Qtx_ratio*Qrx_ratio)"

[[outputs.variables]]
name = "Rtx_ac_ohm"
expression = "re(Zt(TX_TML,TX_TML))"

[[outputs.variables]]
name = "Rrx_ac_ohm"
expression = "re(Zt(RX_TML,RX_TML))"

[[outputs.variables]]
name = "Xtx_ohm"
expression = "im(Zt(TX_TML,TX_TML))"

[[outputs.variables]]
name = "Xrx_ohm"
expression = "im(Zt(RX_TML,RX_TML))"

[[outputs.variables]]
name = "M_over_Ltx_ratio"
expression = "M_uH/Ltx_uH"

[[outputs.variables]]
name = "M_over_Lrx_ratio"
expression = "M_uH/Lrx_uH"

[[outputs.variables]]
name = "Gtx_S"
expression = "re(Yt(TX_TML,TX_TML))"

[[outputs.variables]]
name = "Btx_S"
expression = "im(Yt(TX_TML,TX_TML))"

[[outputs.variables]]
name = "Grx_S"
expression = "re(Yt(RX_TML,RX_TML))"

[[outputs.variables]]
name = "Brx_S"
expression = "im(Yt(RX_TML,RX_TML))"

[[outputs.variables]]
name = "S11_mag_ratio"
expression = "mag(S(TX_TML,TX_TML))"

[[outputs.variables]]
name = "S21_mag_ratio"
expression = "mag(S(TX_TML,RX_TML))"

[[outputs.variables]]
name = "S21_phase_deg"
expression = "ang_deg_val(S(TX_TML,RX_TML))"

[[outputs.variables]]
name = "S22_mag_ratio"
expression = "mag(S(RX_TML,RX_TML))"

[[outputs.variables]]
name = "eta_s21_power_ratio"
expression = "S21_mag_ratio*S21_mag_ratio"

[[outputs.variables]]
name = "eta_tx_accept_ratio"
expression = "1-S11_mag_ratio*S11_mag_ratio"

[[outputs.variables]]
name = "eta_rx_accept_ratio"
expression = "1-S22_mag_ratio*S22_mag_ratio"

[[outputs.variables]]
name = "eta_match_product_ratio"
expression = "eta_tx_accept_ratio*eta_rx_accept_ratio"

[[outputs.variables]]
name = "eta_s21_from_tx_accept_ratio"
expression = "eta_s21_power_ratio/eta_tx_accept_ratio"

[[outputs.variables]]
name = "eta_s21_from_rx_accept_ratio"
expression = "eta_s21_power_ratio/eta_rx_accept_ratio"

[[outputs.variables]]
name = "eta_s21_two_sided_norm_ratio"
expression = "eta_s21_power_ratio/(eta_tx_accept_ratio*eta_rx_accept_ratio)"

[[outputs.variables]]
name = "eta_fom_max_ratio"
expression = "(FOM_ratio*FOM_ratio)/((1+sqrt(1+FOM_ratio*FOM_ratio))*(1+sqrt(1+FOM_ratio*FOM_ratio)))"

# `eta_*_from_*` and `eta_s21_two_sided_norm_ratio` are normalized proxy
# metrics. They can become unstable when the corresponding acceptance term
# approaches zero, so interpret them together with S11/S22 acceptance outputs.

# ----------------------------------------------------------------------------
# Non-model scene/envelope sizes

[tv.width_mm]
range = [false, 1842.0, 1842.0, 1]

[tv.height_mm]
range = [false, 1055.0, 1055.0, 1]

[tv.thickness_mm]
# TV panel thickness (updated to 9mm class).
range = [false, 9.0, 9.0, 1]

[tv.base_z_mm]
# TV bottom elevation from floor (z=0 reference plane).
range = [false, 600.0, 600.0, 1]

[tx.region.outer_w_mm]
range = [false, 160.0, 160.0, 1]

[tx.region.outer_h_mm]
range = [false, 280.0, 280.0, 1]

[tx.region.thickness_mm]
range = [false, 90.0, 90.0, 1]

[tx.region.z_parts.vertical_z_mm]
# Top zone in TX max region for vertical-coil allocation.
