# Unified type2 STEP authoring input.
# ----------------------------------------------------------------------------
# This is the single public type2 authoring TOML for build123d STEP export.
# Non-model guide objects and modeled objects are declared together.

spec_version = "0.2.22"
schema_id = "peetsfea.type2.step.v4"
runtime_compatible = false

[design]
units = "mm"

[backend]
authoring_tool = "build123d"
solver_tool = "hfss"
interchange_format = "step"

[simulation]
radiation_margin_mm = 3500.0

[outputs]
report_name = "Output Variables Table1"
solution_name = "Setup1 : LastAdaptive"
primary_sweep = "Freq"
report_category = "Terminal Solution Data"
plot_type = "Data Table"

[[outputs.variables]]
name = "Lrx_uH"
expression = "im(Zt(RX_TML,RX_TML))/2/pi/freq*1e6"

[[outputs.variables]]
name = "Qrx_ratio"
expression = "im(Zt(RX_TML,RX_TML))/re(Zt(RX_TML,RX_TML))"

[[outputs.variables]]
name = "Rrx_ac_ohm"
expression = "re(Zt(RX_TML,RX_TML))"

[[outputs.variables]]
name = "Xrx_ohm"
expression = "im(Zt(RX_TML,RX_TML))"

[[outputs.variables]]
name = "Grx_S"
expression = "re(Yt(RX_TML,RX_TML))"

[[outputs.variables]]
name = "Brx_S"
expression = "im(Yt(RX_TML,RX_TML))"

[[outputs.variables]]
name = "S22_mag_ratio"
expression = "mag(S(RX_TML,RX_TML))"

[coordinate_system]
origin = [0.0, 0.0, 0.0]
x_axis = "+right_from_wall"
y_axis = "+screen_horizontal"
z_axis = "+up"

