# peetsfea 기본 예제 TOML (`run/type1.toml`은 이 파일을 가리키는 symlink다)
# ----------------------------------------------------------------------------
# Phase 1 스펙 리모델링 기준 구조.
# 중요:
# - 이 파일의 주석은 충분히 자세하고 명시적으로 유지한다.
# - 필드를 추가/수정할 때는 의도와 제약을 설명하는 1~2줄을 꼭 함께 적는다.
# - 주석도 미래 유지보수자/에이전트를 위한 스펙 계약의 일부로 본다.
# 숫자 range 규약:
#   range = [정수여부, 시작값, 끝값, 개수]

spec_version = "0.2.22"

[design]
units = "mm"

[backend]
tool = "hfss"

[simulation]
# EM 정책값. 단위는 Hz/mm이며 em_pipeline이 그대로 SSOT로 사용한다.
# setup/sweep 주파수는 호환성을 위해 남겨두지만
# 현재 런타임에서는 주파수 sweep 생성이 임시 비활성화돼 있다.
radiation_margin_mm = 3500.0
setup_frequency_hz = 6.78e6
sweep_start_hz = 1.0e6
sweep_stop_hz = 45.0e6
validation_gate = "hard_fail"
max_delta_s = 0.007
maximum_passes = 10
minimum_passes = 8
minimum_converged_passes = 10
percent_refinement = 22
basis_order = 1
port_accuracy = 2

# ----------------------------------------------------------------------------
# AEDT output-variable/report 정의

[outputs]
# 0.2.22에서는 output/report 생성을 TOML이 직접 구동한다.
# 이 단일 테이블이 EM pipeline이 만드는 AEDT data-table report의 SSOT다.
report_name = "Output Variables Table1"
solution_name = "Setup1 : LastAdaptive"
primary_sweep = "Freq"
report_category = "Terminal Solution Data"
plot_type = "Data Table"

[[outputs.variables]]
name = "Ltx_uH"
expression = "im(Zt(TX_TML,TX_TML))/2/pi/freq*1e6"

[[outputs.variables]]
name = "Lrx_uH"
expression = "im(Zt(RX_TML,RX_TML))/2/pi/freq*1e6"

[[outputs.variables]]
name = "M_uH"
expression = "abs(im(Zt(TX_TML,RX_TML))/2/pi/freq*1e6)"

[[outputs.variables]]
name = "k_ratio"
expression = "M_uH/sqrt(Ltx_uH*Lrx_uH)"

[[outputs.variables]]
name = "Qtx_ratio"
expression = "im(Zt(TX_TML,TX_TML))/re(Zt(TX_TML,TX_TML))"

[[outputs.variables]]
name = "Qrx_ratio"
expression = "im(Zt(RX_TML,RX_TML))/re(Zt(RX_TML,RX_TML))"

[[outputs.variables]]
name = "FOM_ratio"
expression = "k_ratio*sqrt(Qtx_ratio*Qrx_ratio)"

[[outputs.variables]]
name = "Rtx_ac_ohm"
expression = "re(Zt(TX_TML,TX_TML))"

[[outputs.variables]]
name = "Rrx_ac_ohm"
expression = "re(Zt(RX_TML,RX_TML))"

[[outputs.variables]]
name = "Xtx_ohm"
expression = "im(Zt(TX_TML,TX_TML))"

[[outputs.variables]]
name = "Xrx_ohm"
expression = "im(Zt(RX_TML,RX_TML))"

[[outputs.variables]]
name = "M_over_Ltx_ratio"
expression = "M_uH/Ltx_uH"

[[outputs.variables]]
name = "M_over_Lrx_ratio"
expression = "M_uH/Lrx_uH"

[[outputs.variables]]
name = "Gtx_S"
expression = "re(Yt(TX_TML,TX_TML))"

[[outputs.variables]]
name = "Btx_S"
expression = "im(Yt(TX_TML,TX_TML))"

[[outputs.variables]]
name = "Grx_S"
expression = "re(Yt(RX_TML,RX_TML))"

[[outputs.variables]]
name = "Brx_S"
expression = "im(Yt(RX_TML,RX_TML))"

[[outputs.variables]]
name = "S11_mag_ratio"
expression = "mag(S(TX_TML,TX_TML))"

[[outputs.variables]]
name = "S21_mag_ratio"
expression = "mag(S(TX_TML,RX_TML))"

[[outputs.variables]]
name = "S21_phase_deg"
expression = "ang_deg_val(S(TX_TML,RX_TML))"

[[outputs.variables]]
name = "S22_mag_ratio"
expression = "mag(S(RX_TML,RX_TML))"

[[outputs.variables]]
name = "eta_s21_power_ratio"
expression = "S21_mag_ratio*S21_mag_ratio"

[[outputs.variables]]
name = "eta_tx_accept_ratio"
expression = "1-S11_mag_ratio*S11_mag_ratio"

[[outputs.variables]]
name = "eta_rx_accept_ratio"
expression = "1-S22_mag_ratio*S22_mag_ratio"

[[outputs.variables]]
name = "eta_match_product_ratio"
expression = "eta_tx_accept_ratio*eta_rx_accept_ratio"

[[outputs.variables]]
name = "eta_s21_from_tx_accept_ratio"
expression = "eta_s21_power_ratio/eta_tx_accept_ratio"

[[outputs.variables]]
name = "eta_s21_from_rx_accept_ratio"
expression = "eta_s21_power_ratio/eta_rx_accept_ratio"

[[outputs.variables]]
name = "eta_s21_two_sided_norm_ratio"
expression = "eta_s21_power_ratio/(eta_tx_accept_ratio*eta_rx_accept_ratio)"

[[outputs.variables]]
name = "eta_fom_max_ratio"
expression = "(FOM_ratio*FOM_ratio)/((1+sqrt(1+FOM_ratio*FOM_ratio))*(1+sqrt(1+FOM_ratio*FOM_ratio)))"

# `eta_*_from_*`, `eta_s21_two_sided_norm_ratio`는 정규화된 proxy 지표다.
# 대응되는 acceptance 항이 0에 가까워지면 불안정해질 수 있으므로
# S11/S22 acceptance 출력과 함께 해석해야 한다.

# ----------------------------------------------------------------------------
# 비모델 scene/envelope 크기

[tv.width_mm]
range = [false, 1842.0, 1842.0, 1]

[tv.height_mm]
range = [false, 1055.0, 1055.0, 1]

[tv.thickness_mm]
# TV 패널 두께. 현재 baseline은 9mm급이다.
range = [false, 9.0, 9.0, 1]

[tv.base_z_mm]
# 바닥 기준(z=0) TV 하단 높이.
range = [false, 600.0, 600.0, 1]

[tx.region.outer_w_mm]
range = [false, 160.0, 160.0, 1]

[tx.region.outer_h_mm]
range = [false, 280.0, 280.0, 1]

[tx.region.thickness_mm]
range = [false, 90.0, 90.0, 1]

[tx.region.z_parts.vertical_z_mm]
# TX 최대 영역에서 vertical coil에 할당되는 상단 zone 높이.
range = [false, 5, 15, 17]

[tx.region.z_parts.dd_z_mm]
# TX 최대 영역에서 DD coil에 할당되는 중간 zone 높이.
range = [false, 15.0, 45.0, 21]
# 하단 leftover 두께는 암묵적으로 결정된다:
# leftover_z = tx.region.thickness_mm - vertical_z_mm - dd_z_mm

[rx.region.outer_w_mm]
range = [false, 560.0, 560.0, 1]

[rx.region.outer_h_mm]
range = [false, 360.0, 360.0, 1]

[rx.region.thickness_mm]
# RX region 두께는 벽 정렬 배치 baseline 기준 4mm로 고정한다.
range = [false, 4.0, 4.0, 1]

[wall.thickness_mm]
range = [false, 200.0, 200.0, 1]

[wall.size_y_mm]
range = [false, 4000.0, 4000.0, 1]

[wall.size_z_mm]
range = [false, 3000.0, 3000.0, 1]

[floor.thickness_mm]
range = [false, 300.0, 300.0, 1]

[floor.size_x_mm]
range = [false, 5000.0, 5000.0, 1]

[floor.size_y_mm]
range = [false, 5000.0, 5000.0, 1]

# ----------------------------------------------------------------------------
# Ferrite 정책 제어

[ferrite.present]
# 전역 ferrite 토글. 0이면 RX/TX ferrite plate를 모두 제거하고 1이면 둘 다 활성화한다.
range = [true, 0, 1, 2]

[ferrite.rx_thickness_mm]
# RX ferrite는 TV 내부 RX coil footprint 뒤쪽의 2.0mm plate로 고정한다.
range = [false, 2.0, 2.0, 1]

[ferrite.tx_thickness_mm]
# TX ferrite는 최하단 TX XY FR4 layer 아래의 2.0mm plate다.
range = [false, 2.0, 2.0, 1]

[ferrite.tx_gap_mm]
# 최하단 TX XY FR4 layer 아래의 TX ferrite gap이다.
# 이 gap은 TX coil copper, TX bridge object, TX FR4 live object와 비접촉이어야 한다.
range = [false, 3.1, 12.0, 12]

[ferrite.relative_permeability]
# 0.2.22 기준의 이상화 ferrite 재질 baseline.
range = [false, 500.0, 500.0, 1]

# ----------------------------------------------------------------------------
# 그룹별 coil geometry 제어

[coil_shape.neo_tx_dd.outer_x]
# TX DD 외곽 X span.
range = [false, 30.0, 158.0, 135]

[coil_shape.neo_tx_dd.outer_y]
# TX DD 외곽 Y span.
range = [false, 60.0, 130.0, 120]

[coil_shape.neo_tx_vertical.outer_x]
# 파생 dummy marker. tx_vertical outer_x는 직접 샘플링하지 않는다.
# resolver가 coil_shape.neo_tx_dd.outer_x에서 파생한다.
range = [false, -1, -1, -1]

[coil_shape.neo_tx_vertical.outer_y]
# TX vertical 외곽 Y span.
range = [false, 60.0, 130.0, 120]

[coil_shape.rx_dd.outer_x]
# RX DD 외곽 X span.
range = [false, 60.0, 158.0, 15]

[coil_shape.rx_dd.outer_y]
# RX DD 외곽 Y span.
range = [false, 60.0, 130.0, 120]

[coil_shape.corner_mode]
# 코일 코너 형상 모드.
# 0 = sharp_90, 1 = blunt
range = [true, 0, 1, 2]

# 그룹별 coil spacing 제어
[coil_spacing.neo_tx_dd_pair_spacing_ratio]
# tx.region.outer_h_mm 대비 TX DD pair spacing 비율.
range = [false, 0.01, 0.12, 75]

[coil_spacing.rx_dd_pair_spacing_ratio]
# rx.region.outer_h_mm 대비 RX DD pair spacing 비율.
range = [false, 0.01, 0.03, 38]

[coil_spacing.tx_vertical_center_gap_mm]
# Y 방향으로 인접한 tx_vertical coil 사이의 중심 간격이다.
# tx_vertical_span_mm은 resolver가 center_gap * max(0, selected_count - 1)로 파생한다.
range = [false, 1.62, 15.0, 12]

# 그룹별 geometry 자유변수다.
# 한 key는 하나의 의미만 가진다. 그룹 간 turns/trace/gap 전역 공유 key는 두지 않는다.
# geometry는 아래 규칙으로 파생한다.
#   effective_outer_y =
#     - tx_vertical: min(outer_y, tx.region.z_parts.vertical_z_mm)
#     - tx_dd/rx_dd: outer_y
#   base_outer = min(outer_x, effective_outer_y)
#   band_mm  = band_ratio * base_outer
#   pitch_mm = band_mm / turn_count
#   trace_mm = pitch_mm * metal_ratio
#   gap_mm   = pitch_mm * (1 - metal_ratio)
# 여기서 `metal_ratio`는 동일 pitch cell당 금속 점유 비율이다.
# resolver는 각 path를 attempt당 한 번만 선택하고 내부 소비자 전체에서 재사용한다.
# 제약이 실패하면 deterministic retry가 attempt offset을 써서 같은 seed에 같은 재시도 순서를 만든다.
[coil_groups_params.neo_tx_dd.turn_count]
# tx_dd가 4개 인스턴스(적층 XY 2층)로 해석되면, 아래층은 같은 realized turn_count를 유지하되
# centerline box를 one-pitch만큼 줄여 위층 gap 중심에 대략 interleave되게 한다.
# 공개 런타임 계약은 1..3이다.
range = [true, 1, 4, 4]
[coil_groups_params.neo_tx_dd.band_ratio]
range = [false, 0.1, 0.35, 60]
[coil_groups_params.neo_tx_dd.metal_ratio]
range = [false, 0.15, 0.60, 75]

[coil_groups_params.neo_tx_vertical.turn_count]
range = [true, 1, 4, 4]
[coil_groups_params.neo_tx_vertical.band_ratio]
range = [false, 0.35, 0.5, 30]
[coil_groups_params.neo_tx_vertical.metal_ratio]
range = [false, 0.45, 0.75, 75]

[coil_groups_params.rx_dd.turn_count]
range = [true, 1, 4, 4]
[coil_groups_params.rx_dd.band_ratio]
range = [false, 0.1, 0.35, 60]
[coil_groups_params.rx_dd.metal_ratio]
range = [false, 0.40, 0.90, 75]

# ----------------------------------------------------------------------------
# 끌어올린 고정 설계값 (TOML SSOT 계약을 위해 count=1 유지)
# 예전에는 resolver/geometry에 하드코딩돼 있었지만
# 이제 optimizer와 data pipeline이 같은 SSOT를 보도록 TOML에 명시한다.

[coil_material.via_diameter_mm]
# coil feed-through용 via 직경(mm). 0 이하는 허용하지 않는다.
range = [false, 0.5, 0.5, 1]

[coil_material.pcb_thickness_mm]
# PCB dielectric 두께(mm). geometry 생성을 위해 반드시 0보다 커야 한다.
range = [false, 1.6, 1.6, 1]

[coil_material.cu_thickness_mm]
# 구리 trace 두께(mm). 반드시 0보다 커야 한다.
range = [false, 0.1, 0.1, 1]

[coil_material.fr4_er]
# FR4 상대 유전율. 물리적 의미를 가지려면 1.0보다 커야 한다.
range = [false, 4.4, 4.4, 1]

[scene_anchor.shelf_height_mm]
# TX region이 시작되는 shelf top 높이(mm)다.
# 기본값 461mm는 nominal TX-region-top -> RX-region-bottom gap을 50mm로 유지한다.
range = [false, 461.0, 461.0, 1]

[scene_anchor.shelf_min_size_x_mm]
# scene envelope이 확보되도록 하는 +X 방향 최소 shelf 크기(mm).
range = [false, 350.0, 350.0, 1]

[scene_anchor.rx_region_bottom_from_tv_mm]
# TV base plane 대비 RX region bottom offset(mm). 0 이상이어야 한다.
range = [false, 1.0, 1.0, 1]

[coil_placement.neo_tx_dd_top_offset_ratio]
# TX DD zone top face에서 DD coil top까지 내려오는 비율이다.
# 기준 길이는 tx.region.z_parts.dd_z_mm이며, 0.0은 zone top에 붙이고 0.3은 DD zone 내부로 30% 내린다.
range = [false, 0.01, 0.6, 30]

[coil_placement.tx_vertical_orientation_mode]
# mode 0 = no tx_vertical coil, mode 1 = ZX tx_vertical
range = [true, 0, 1, 2]

[coil_placement.rx_face_clearance_mm]
# RX +X face(TV 쪽)에서 RX DD coil face까지의 clearance(mm). 0 이상이어야 한다.
range = [false, 0.0, 0.0, 1]

[coil_placement.dd_mirror_plane]
# DD pair 대칭을 위한 mirror plane 계약.
value = "XZ"

[coil_placement.rx_plane]
# RX coil 배치 plane 계약(바닥에 수직).
value = "YZ"

# neo coil terminal-path 계약 묶음.
# 모든 path 값은 `<start>_<cw|ccw>_to_<end>` 형식을 사용한다.
# tx_vertical neo migration도 같은 블록에서 관리한다.
[coil_placement.neo_tx_dd_right_terminal_path]
value = "D_ccw_to_d"

[coil_placement.neo_tx_dd_left_terminal_path]
value = "a_cw_to_A"

# ZX/XZ legacy tx_vertical terminal-path contract.
# viewing convention:
# - view direction: +Y
# - up: +Z
# - left: +X
# canonical default under that convention: `B_ccw_to_c`
# plane is still owned by existing tx_vertical placement/orientation rules;
# do not add a separate neo-only plane key.
[coil_placement.neo_tx_vertical_zx_terminal_path]
value = "B_ccw_to_c"

[pcb_spacing.tx_main_1_z_from_tx_main_0_mm]
# tx_main_0 기준 tx_main_1의 상대 Z 간격(mm).
# tx_main_1은 position.z = -1 dummy marker를 쓰고, 최종 z는 resolver가 이 range에서 파생한다.
range = [false, 4, 7, 8]

# ----------------------------------------------------------------------------
# 선언형 제약 (preflight validity check용 SSOT)
# 규칙 형식:
# - kind = "comparison": lhs.path <op> rhs.path|rhs.value|rhs.func
# - kind = "range": target.path에 대한 min/max 경계
# - kind = "aggregate": 선택된 그룹 전체에 대한 집계

[constraints]

# 물리적 sanity check: coil outer_x는 양수(mm)여야 한다. 아니면 geometry build를 막는다.
[[constraints.rules]]
id = "outer_x_positive"
kind = "comparison"
message = "outer_x must be > 0"
lhs = { path = "outer_x" }
op = ">"
rhs = { value = 0.0 }

# 물리적 sanity check: coil outer_y는 양수(mm)여야 한다. 아니면 geometry build를 막는다.
[[constraints.rules]]
id = "outer_y_positive"
kind = "comparison"
message = "outer_y must be > 0"
lhs = { path = "outer_y" }
op = ">"
rhs = { value = 0.0 }

# TX DD mirrored pair clearance는 양수(mm)여야 한다.
[[constraints.rules]]
id = "tx_dd_spacing_positive"
kind = "comparison"
message = "tx_dd_pair_spacing_mm must be > 0"
lhs = { path = "tx_dd_pair_spacing_mm" }
op = ">"
rhs = { value = 0.0 }

[[constraints.rules]]
id = "tx_dd_spacing_ratio_upper_bound"
kind = "comparison"
message = "tx_dd_pair_spacing_ratio must be <= 0.12"
lhs = { path = "tx_dd_pair_spacing_ratio" }
op = "<="
rhs = { value = 0.12 }

# RX DD pair edge gap은 음수가 아니어야 한다(mm).
[[constraints.rules]]
id = "rx_dd_spacing_positive"
kind = "comparison"
message = "rx_dd_pair_spacing_mm must be >= 0"
lhs = { path = "rx_dd_pair_spacing_mm" }
op = ">="
rhs = { value = 0.0 }

[[constraints.rules]]
id = "rx_dd_spacing_ratio_upper_bound"
kind = "comparison"
message = "rx_dd_pair_spacing_ratio must be <= 0.03"
lhs = { path = "rx_dd_pair_spacing_ratio" }
op = "<="
rhs = { value = 0.03 }

# 지원되는 배치 모드에서 vertical center gap은 [1.62, 15] mm 범위여야 한다.
[[constraints.rules]]
id = "tx_vertical_center_gap_range"
kind = "range"
message = "tx_vertical_center_gap_mm must be in [1.62,15]"
target = { path = "tx_vertical_center_gap_mm" }
min = { value = 1.62 }
max = { value = 15.0 }
inclusive_min = true
inclusive_max = true

[[constraints.rules]]
id = "tx_vertical_orientation_mode_supported"
kind = "range"
message = "tx_vertical_orientation_mode must be in [0,1]"
target = { path = "tx_vertical_orientation_mode" }
min = { value = 0.0 }
max = { value = 1.0 }
inclusive_min = true
inclusive_max = true

[[constraints.rules]]
id = "corner_mode_supported"
kind = "range"
message = "corner_mode must be in [0,1]"
target = { path = "corner_mode" }
min = { value = 0.0 }
max = { value = 1.0 }
inclusive_min = true
inclusive_max = true

# TX region outer dimension은 양수(mm)여야 한다. 아니면 envelope 자체가 무효다.
[[constraints.rules]]
id = "tx_region_outer_w_positive"
kind = "comparison"
message = "tx_region_outer_w_mm must be > 0"
lhs = { path = "tx_region_outer_w_mm" }
op = ">"
rhs = { value = 0.0 }

# TX region outer dimension은 양수(mm)여야 한다. 아니면 envelope 자체가 무효다.
[[constraints.rules]]
id = "tx_region_outer_h_positive"
kind = "comparison"
message = "tx_region_outer_h_mm must be > 0"
lhs = { path = "tx_region_outer_h_mm" }
op = ">"
rhs = { value = 0.0 }

# TX region thickness는 양수(mm)여야 한다. 아니면 layer stack이 성립하지 않는다.
[[constraints.rules]]
id = "tx_region_thickness_positive"
kind = "comparison"
message = "tx_region_thickness_mm must be > 0"
lhs = { path = "tx_region_thickness_mm" }
op = ">"
rhs = { value = 0.0 }

# vertical/DD zone thickness는 양수(mm)여야 한다. 아니면 배치가 실패한다.
[[constraints.rules]]
id = "tx_region_vertical_z_positive"
kind = "comparison"
message = "tx_region_vertical_z_mm must be > 0"
lhs = { path = "tx_region_vertical_z_mm" }
op = ">"
rhs = { value = 0.0 }

# vertical/DD zone thickness는 양수(mm)여야 한다. 아니면 배치가 실패한다.
[[constraints.rules]]
id = "tx_region_dd_z_positive"
kind = "comparison"
message = "tx_region_dd_z_mm must be > 0"
lhs = { path = "tx_region_dd_z_mm" }
op = ">"
rhs = { value = 0.0 }

# leftover_z = thickness - vertical_z - dd_z 는 음수가 아니어야 한다(mm).
[[constraints.rules]]
id = "tx_region_leftover_non_negative"
kind = "comparison"
message = "tx.region.leftover_z_mm computed negative; reduce vertical_z/dd_z or increase tx.region.thickness_mm"
lhs = { path = "tx_region_leftover_z_mm" }
op = ">="
rhs = { value = 0.0 }

# coil outer는 TX region width(mm) 안에 들어와야 한다. 아니면 레이아웃이 맞지 않는다.
[[constraints.rules]]
id = "coil_outer_x_fits_tx_region"
kind = "comparison"
message = "TX coil outer_x must be < tx.region.outer_w_mm"
lhs = { path = "outer_x" }
op = "<"
rhs = { path = "tx_region_outer_w_mm" }

# 배치 가능성 gate: tx_dd pair는 tx region height 안에 들어와야 한다.
[[constraints.rules]]
id = "tx_dd_pair_fits_region"
kind = "comparison"
message = "2*tx_dd_outer_y + tx_dd_pair_spacing_mm must be <= tx_region_outer_h_mm"
lhs = { func = "add(mul(2,tx_dd_outer_y),tx_dd_pair_spacing_mm)" }
op = "<="
rhs = { path = "tx_region_outer_h_mm" }

# ZX legacy Y-order guard: DD->vertical bridge endpoint는 vertical copper outer edge보다 오른쪽에 있어야 한다.
# 현재 active vertical path는 ZX뿐이므로, tx_vertical이 비활성이면 이 guard는 pass로 처리한다.
[[constraints.rules]]
id = "tx_bridge_no_pierce"
kind = "comparison"
message = "tx_dd right representative y must be >= tx_vertical right outer edge y + clearance"
lhs = { func = "tx_bridge_no_pierce_ok(0.0)" }
op = "=="
rhs = { value = 1.0 }

# 배치 가능성 gate: rx_dd pair는 rx region width 안에 들어와야 한다.
[[constraints.rules]]
id = "rx_dd_pair_fits_region"
kind = "comparison"
message = "2*rx_dd_outer_x + rx_dd_pair_spacing_mm must be <= rx_region_outer_w_mm"
lhs = { func = "add(mul(2,rx_dd_outer_x),rx_dd_pair_spacing_mm)" }
op = "<="
rhs = { path = "rx_region_outer_w_mm" }

# geometry 가능성 gate: tx_vertical의 requested turns는 feasible_turns_max를 넘으면 안 된다.
[[constraints.rules]]
id = "tx_vertical_turn_count_within_feasible_max"
kind = "comparison"
message = "tx_vertical turn_count must be <= feasible_turns_max under capped vertical zone"
lhs = { path = "selected_group_geometry.tx_vertical.turn_count" }
op = "<="
rhs = { func = "feasible_turns_max(tx_vertical,outer_x,outer_y,tx_region_vertical_z_mm)" }

[[constraints.rules]]
id = "tx_dd_turn_count_within_feasible_max"
kind = "comparison"
message = "tx_dd turn_count must be <= feasible_turns_max"
lhs = { path = "selected_group_geometry.tx_dd.turn_count" }
op = "<="
rhs = { func = "feasible_turns_max(tx_dd,outer_x,outer_y,outer_y)" }

[[constraints.rules]]
id = "tx_dd_trace_width_vs_via_diameter"
kind = "comparison"
message = "tx_dd trace width must be >= via_diameter_mm"
lhs = { func = "mul(min(outer_x,outer_y),selected_group_geometry.tx_dd.band_ratio,selected_group_geometry.tx_dd.metal_ratio)" }
op = ">="
rhs = { func = "mul(via_diameter_mm,selected_group_geometry.tx_dd.turn_count)" }

[[constraints.rules]]
id = "rx_dd_turn_count_within_feasible_max"
kind = "comparison"
message = "rx_dd turn_count must be <= feasible_turns_max"
lhs = { path = "selected_group_geometry.rx_dd.turn_count" }
op = "<="
rhs = { func = "feasible_turns_max(rx_dd,outer_x,outer_y,outer_y)" }

# 집계 상한: 지원하는 scene 복잡도를 위해 total selected coil count는 10 이하로 제한한다.
[[constraints.rules]]
id = "max_total_selected_coils"
kind = "aggregate"
message = "Total selected coil count must be <= 10"
agg = "sum_group_selected_count"
op = "<="
rhs = { value = 10.0 }

