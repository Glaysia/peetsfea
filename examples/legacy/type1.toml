# ----------------------------------------------------------------------------
# Coil groups

[[coil_groups]]
kind = "tx_dd"
# Tx DD는 현재 right-only coil path만 남아 있다.
# left half 관련 runtime path는 제거되었고, downstream reconnect 단계는 비활성화되어 있다.
# Tx DD는 당분간 단층(1-layer)만 사용한다.
stacked_mode = [true, 0, 0, 1]
instance_transforms = [
  { dx = 0.0, dy = 0.0, dz = 0.0, rot_deg = 0.0 },
]

[[coil_groups]]
kind = "tx_vertical"
# TX vertical requested count는 legacy ZX mode 기준이다.
# tx_vertical_orientation_mode=0이면 sampling owner는 유지하지만 realized selected_count는 0이 된다.
count_range = [true, 1, 6, 6]
instance_transforms = [
  { dx = 0.0, dy = 0.0, dz = 0.0, rot_deg = 0.0 },
]

[[coil_groups]]
kind = "rx_dd"
count_fixed = [true, 2, 2, 1]
instance_transforms = [
  { dx = 0.0, dy = 0.0, dz = 0.0, rot_deg = 180.0 },
]

# ----------------------------------------------------------------------------
# PCB 인스턴스 (총 9개: 항상 켜지는 5개 + optional 4개)
# - 0.2.22 fixed-topology mode:
#   coil count가 1차 계약이고, PCB present/mount는 이 topology로 정규화된다.
# - tx_vertical은 전용 host board `tx_vertical_0`를 사용한다.
# - optional board는 호환성을 위해 스펙에는 남겨두지만 실제로는 강제로 비활성화된다.

[[pcbs]]
id = "tx_main_0"
role = "tx"
position = [0.0, 0.0, 0.0]
rotation_deg = 0.0
present = [true, 1, 1, 1]
z_mode = "absolute"
[[pcbs.mounts]]
kind = "tx_dd"
selector_mode = "index"
# tx_dd selector_index는 layer slot 기준으로 정규화된다.
# 현재 runtime은 same-layer historical pair index를 같은 right-only tx_dd slot으로 해석한다.
selector_index = 0
[[pcbs.mounts]]
kind = "tx_dd"
selector_mode = "index"
selector_index = 1

[[pcbs]]
id = "tx_main_1"
role = "tx"
# relative-z 모드: 최종 z = tx_main_0.position_z + sampled(z_delta_path)
position = [0.0, 0.0, 0.0]
rotation_deg = 0.0
present = [true, 1, 1, 1]
z_mode = "relative_to_pcb"
z_relative_base_id = "tx_main_0"
z_delta_path = "pcb_spacing.tx_main_1_z_from_tx_main_0_mm"
mounts = []

[[pcbs]]
id = "tx_vertical_0"
role = "tx"
position = [0.0, 0.0, 0.0]
rotation_deg = 0.0
present = [true, 1, 1, 1]
z_mode = "absolute"
[[pcbs.mounts]]
kind = "tx_vertical"
selector_mode = "all"

[[pcbs]]
id = "rx_main_0"
role = "rx"
position = [0.0, 0.0, 110.0]
rotation_deg = 0.0
present = [true, 1, 1, 1]
z_mode = "absolute"
[[pcbs.mounts]]
kind = "rx_dd"
selector_mode = "index"
selector_index = 0

[[pcbs]]
id = "rx_main_1"
role = "rx"
position = [0.0, 0.0, 112.0]
rotation_deg = 0.0
present = [true, 1, 1, 1]
z_mode = "absolute"
[[pcbs.mounts]]
kind = "rx_dd"
selector_mode = "index"
selector_index = 1

[[pcbs]]
id = "tx_opt_0"
role = "tx"
position = [40.0, 0.0, 0.0]
rotation_deg = 0.0
present = [true, 0, 0, 1]
z_mode = "absolute"
mounts = []

[[pcbs]]
id = "tx_opt_1"
role = "tx"
position = [-40.0, 0.0, 0.0]
rotation_deg = 0.0
present = [true, 0, 0, 1]
z_mode = "absolute"
mounts = []

[[pcbs]]
id = "rx_opt_0"
role = "rx"
position = [40.0, 0.0, 110.0]
rotation_deg = 0.0
present = [true, 0, 0, 1]
z_mode = "absolute"
mounts = []

[[pcbs]]
id = "rx_opt_1"
role = "rx"
position = [-40.0, 0.0, 110.0]
rotation_deg = 0.0
present = [true, 0, 0, 1]
z_mode = "absolute"
mounts = []
