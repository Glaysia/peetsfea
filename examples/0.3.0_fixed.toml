[modeled_objects.turn_n_int]
range = [true, 3, 3, 1]
description = "TX SSW band count"

[modeled_objects.gap_ratio]
range = [false, 0.24, 0.24, 1]
description = "TX SSW pitch 중 gap 비율"

[modeled_objects.void_area_ratio]
